[project]
name = "ai-service"
version = "0.1.0"
description = "AI service for the PM monorepo"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "PM Team" },
]
keywords = ["ai", "fastapi", "llm"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Runtime dependencies — kept minimal. Add providers (openai, anthropic, litellm, etc.) per-feature.
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "python-json-logger>=2.0.7,<3.0",
    "httpx>=0.27.0,<1.0",  # for Outbound HTTP clients (node-backend calls, health probes)
    "neo4j>=5.20.0,<6.0",  # official async Python driver for Neo4j (Aura + self-hosted)
    # LangChain + LangGraph for the agentic layer.
    # The ai-service does NOT connect to Postgres directly — tools call the
    # node-backend over HTTP instead.
    "langchain>=0.3.0,<1.0",
    "langchain-core>=0.3.0,<1.0",
    "langgraph>=0.2.0,<1.0",
    "langchain-groq>=0.2.0,<1.0",  # Groq LLM provider
    "langchain-openai>=0.2.0,<1.0",  # OpenAI-compatible — used for MiniMax
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=6.0.0,<7.0",
    "ruff>=0.7.0,<1.0",
    "mypy>=1.13.0,<2.0",
    "types-python-dateutil>=2.9.0,<3.0",
]

# `uv run ai-service` → starts uvicorn
[project.scripts]
ai-service = "ai_service.main:run"

[project.urls]
Repository = "https://github.com/example/pm"

# ---------------------------------------------------------------------------
# uv build backend
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI uses function calls in defaults (Depends, Query, ...)
]

[tool.ruff.lint.isort]
known-first-party = ["ai_service"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# asyncpg ships no type stubs.
module = "asyncpg"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=ai_service",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["src/ai_service"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
