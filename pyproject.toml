[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain>=1.3.2",
    "langchain-core>=1.4.0",
    "langchain-groq>=1.1.2",
    "langchain-openai>=0.3.0",
    "langgraph>=1.2.2",
    "loguru>=0.7.3",
    "neo4j>=6.2.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that call real external APIs (e.g. Groq). Run manually or in a scheduled job, not on the rate-limited PR path.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# Test code is not shipped — it intentionally builds partial/edge-case fixtures
# (e.g. unpacking dicts as kwargs, omitting fields) that fight strict typing for
# no production benefit. Keep strict on the source package; skip it for tests.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
